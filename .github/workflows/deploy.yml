name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    # update-data.yml commits with the default GITHUB_TOKEN, and pushes made
    # with that token don't trigger other workflows' `push` events (GitHub's
    # loop-prevention). Without this, a successful data update never
    # redeploys the site. workflow_run isn't subject to that restriction.
    workflows: ["Update market data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, head_sha is fixed at the commit that *triggered*
          # update-data.yml, not the data-update commit it pushes at the end
          # of its own run — using it here silently rebuilt the previous,
          # pre-refresh commit on every cron-triggered deploy. head_branch
          # checks out the branch's current tip instead, which does include
          # that just-pushed commit.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
