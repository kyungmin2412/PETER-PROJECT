name: Update market data

on:
  schedule:
    # 06:27 KST every day (21:27 UTC the previous day), per explicit request.
    # Originally 06:30 exactly, but that's a popular round-number slot across
    # all of GitHub Actions and the one scheduled run so far landed ~1h35m
    # late (queued at 21:30 UTC, actually ran 23:05 UTC) — moved a few
    # minutes off the half-hour mark to sidestep that queuing congestion.
    # Even so, GitHub doesn't guarantee scheduled runs fire at the exact
    # minute, so some jitter is still expected/normal, not a failure.
    - cron: "27 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch US market data
        run: python scripts/fetch_market_data.py

      - name: Fetch Korea market data
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/fetch_korea_data.py

      - name: Commit data if changed
        run: |
          if git diff --quiet -- src/data/latest.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/latest.json
          git commit -m "chore: update market data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
