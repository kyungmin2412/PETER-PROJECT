name: Update market data

on:
  schedule:
    # 06:30 KST every day (21:30 UTC the previous day), per explicit request.
    # GitHub queues scheduled runs and the exact half-hour mark can see some
    # congestion (a contributing factor in a ~2h-late run on 2026-08-10 at
    # the top of the hour), so an actual firing a few minutes after 06:30 is
    # expected/normal, not a failure.
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch US market data
        run: python scripts/fetch_market_data.py

      - name: Fetch Korea market data
        run: python scripts/fetch_korea_data.py

      - name: Commit data if changed
        run: |
          if git diff --quiet -- src/data/latest.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/latest.json
          git commit -m "chore: update market data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
